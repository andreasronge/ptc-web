<!doctype html><html><head><title>Widget API</title></head><body><aside>API navigation</aside><main>
<h1>Widget API</h1><p>Create a widget with <code>makeWidget</code>.</p>
<pre><code class="language-ts">const widget = makeWidget({ color: "blue" });</code></pre>
<table><thead><tr><th>Field</th><th>Type</th></tr></thead><tbody><tr><td>color</td><td>string</td></tr></tbody></table>
<h2 id="errors">Errors</h2><p>Invalid colors return <code>BAD_COLOR</code>.</p>
</main></body></html>
